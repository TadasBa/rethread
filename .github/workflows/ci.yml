name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - dev
      - main

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check
